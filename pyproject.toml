[project]
name = "agent-core-deep-agent"
version = "0.1.0"
description = "Deep agent powered by Claude via the Anthropic API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "aws-cdk-lib>=2.243.0",
    "python-dotenv>=1.0.0",
    "langchain >= 1.0.3",
    "langchain-mcp-adapters >= 0.1.11",
    "langchain-aws>=1.0.0",
    "langgraph >= 1.0.2",
    "bedrock-agentcore>=1.4.6",
    "mcp-client>=0.0.0",
    "aws-opentelemetry-distro>=0.15.0",
]

[project.optional-dependencies]
infra = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core_deep_agent"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bedrock-agentcore-starter-toolkit>=0.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
